name: Build Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Validate release tag
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9][0-9A-Za-z._+-]{0,127}$ ]] || { echo "Invalid release tag: $tag" >&2; exit 2; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag is on main
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$TAG"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "Release tag $TAG is not reachable from main." >&2
            exit 1
          }

  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x64
            pnpm_version: 10.24.0
            package_json_file: package.json
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            pnpm_version: 10.24.0
            package_json_file: package.json
          - runner: macos-15
            os: macos
            arch: arm64
            pnpm_version: 10.24.0
            package_json_file: package.json
          - runner: macos-15-intel
            os: macos
            arch: x64
            pnpm_version: 10.24.0
            package_json_file: package.json
          - runner: windows-2022
            os: windows
            arch: x64
            pnpm_version: 11.25.0
            package_json_file: .github/release-pnpm-tooling.json
          - runner: windows-11-arm
            os: windows
            arch: arm64
            pnpm_version: 11.25.0
            package_json_file: .github/release-pnpm-tooling.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare isolated pnpm package metadata
        if: matrix.os == 'windows'
        shell: bash
        run: |
          cat > .github/release-pnpm-tooling.json <<'JSON'
          {
            "name": "seerrng-release-tooling",
            "private": true
          }
          JSON

      - name: Pnpm Setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ matrix.pnpm_version }}
          package_json_file: ${{ matrix.package_json_file }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false

      - name: Verify runner platform
        shell: bash
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          actual_platform="$(node -p 'process.platform')"
          actual_arch="$(node -p 'process.arch')"
          case "$EXPECTED_OS" in
            linux) expected_platform=linux ;;
            macos) expected_platform=darwin ;;
            windows) expected_platform=win32 ;;
            *) echo "Unsupported release OS matrix value: $EXPECTED_OS" >&2; exit 1 ;;
          esac
          [[ "$actual_platform" == "$expected_platform" ]] || {
            echo "Release runner platform mismatch: expected $expected_platform, got $actual_platform" >&2
            exit 1
          }
          [[ "$actual_arch" == "$EXPECTED_ARCH" ]] || {
            echo "Release runner architecture mismatch: expected $EXPECTED_ARCH, got $actual_arch" >&2
            exit 1
          }

      - name: Build archive
        shell: bash
        run: ./scripts/build-release-assets.sh "${TAG}" dist-release
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          GYP_MSVS_VERSION: ${{ matrix.os == 'windows' && matrix.arch == 'arm64' && '2026' || 'auto' }}
          npm_config_engine_strict: ${{ matrix.pnpm_version == '11.25.0' && 'false' || 'true' }}
          npm_config_manage_package_manager_versions: 'false'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: seerrng-${{ matrix.os }}-${{ matrix.arch }}
          path: dist-release/seerrng-*

  build-jellyfin-plugin:
    name: Build optional Jellyfin plugin
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Build plugin archive and repository manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          plugin_dir='integrations/jellyfin-plugin'
          release_dir='dist-release'
          plugin_version="$(jq -er '.version' "$plugin_dir/meta.json")"
          target_abi="$(jq -er '.targetAbi' "$plugin_dir/meta.json")"
          plugin_guid="$(jq -er '.guid' "$plugin_dir/meta.json")"
          [[ "$plugin_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$target_abi" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$plugin_guid" == '812a21b1-2e18-4ff7-a9b8-3dd84e2a0e16' ]]
          mkdir -p "$release_dir/plugin"
          dotnet publish "$plugin_dir/SeerrNG.JellyfinBridge.csproj" \
            --configuration Release \
            --output "$release_dir/plugin"
          test -s "$release_dir/plugin/Jellyfin.Plugin.SeerrNGBridge.dll"
          cp "$plugin_dir/meta.json" "$release_dir/plugin/meta.json"
          archive="seerrng-jellyfin-bridge-${RELEASE_TAG}.zip"
          (
            cd "$release_dir/plugin"
            zip -q "../$archive" Jellyfin.Plugin.SeerrNGBridge.dll meta.json
          )
          (
            cd "$release_dir"
            sha256sum "$archive" > "${archive%.zip}.sha256"
          )
          checksum="$(md5sum "$release_dir/$archive" | cut -d ' ' -f1)"
          [[ "$checksum" =~ ^[a-f0-9]{32}$ ]]
          source_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${archive}"
          jq -n \
            --arg guid "$plugin_guid" \
            --arg version "$plugin_version" \
            --arg targetAbi "$target_abi" \
            --arg sourceUrl "$source_url" \
            --arg checksum "$checksum" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '[{
              guid: $guid,
              name: "SeerrNG Bridge",
              description: "Optional Jellyfin menu link to a separately deployed SeerrNG server.",
              overview: "Open SeerrNG using the current Jellyfin session.",
              owner: "snapetech",
              category: "General",
              versions: [{
                version: $version,
                changelog: "Initial SeerrNG Jellyfin Bridge release.",
                targetAbi: $targetAbi,
                sourceUrl: $sourceUrl,
                checksum: $checksum,
                timestamp: $timestamp
              }]
            }]' > "$release_dir/seerrng-jellyfin-plugin-manifest.json"
          jq -e --arg guid "$plugin_guid" --arg checksum "$checksum" \
            'length == 1 and .[0].guid == $guid and .[0].versions[0].checksum == $checksum' \
            "$release_dir/seerrng-jellyfin-plugin-manifest.json" >/dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: seerrng-jellyfin-plugin
          path: dist-release/seerrng-jellyfin-*

  publish:
    name: Upload release assets
    needs: [resolve, build, build-jellyfin-plugin]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download built assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: seerrng-*
          path: dist-release
          merge-multiple: true

      - name: Verify archive inventory and checksums
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          expected=(
            "seerrng-${TAG}-linux-x64.tar.gz"
            "seerrng-${TAG}-linux-arm64.tar.gz"
            "seerrng-${TAG}-macos-arm64.tar.gz"
            "seerrng-${TAG}-macos-x64.tar.gz"
            "seerrng-${TAG}-windows-x64.zip"
            "seerrng-${TAG}-windows-arm64.zip"
            "seerrng-jellyfin-bridge-${TAG}.zip"
          )
          for archive in "${expected[@]}"; do
            test -f "dist-release/$archive"
            archive_base="${archive%.tar.gz}"
            archive_base="${archive_base%.zip}"
            checksum="dist-release/$archive_base.sha256"
            test -f "$checksum"
            (
              cd dist-release
              sha256sum -c "$(basename "$checksum")"
            )
          done
          mapfile -t archives < <(find dist-release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' | sort)
          printf '%s\n' "${archives[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${archives[@]}")

      - name: Upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          draft: true
          files: |
            dist-release/seerrng-*
