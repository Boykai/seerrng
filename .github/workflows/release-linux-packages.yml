name: Build Linux Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true

permissions:
  contents: write

jobs:
  deb:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9][0-9A-Za-z._+-]{0,127}$ ]] || { echo "Invalid release tag: $tag" >&2; exit 2; }
          [[ "$tag" != *-* ]] || { echo "Stable package channels reject pre-release tag: $tag" >&2; exit 2; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Verify release tag is on main
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: bash scripts/ensure-release-tag-on-main.sh "$TAG"
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y build-essential debhelper devscripts dpkg-dev
      - name: Download Linux asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in {1..80}; do
            if gh release download "${{ steps.version.outputs.tag }}" -R "$GITHUB_REPOSITORY" --pattern "seerrng-${{ steps.version.outputs.tag }}-linux-x64.tar.gz" --clobber; then
              exit 0
            fi
            sleep 30
          done
          exit 1
      - name: Build deb
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          src="seerrng-${version}"
          rm -rf "$src"
          mkdir -p "$src/usr/lib/seerrng" "$src/usr/bin" "$src/lib/systemd/system" "$src/etc/seerrng" \
            "$src/usr/lib/sysusers.d" "$src/usr/lib/tmpfiles.d"
          tar -xzf "seerrng-v${version}-linux-x64.tar.gz" --strip-components=1 -C "$src/usr/lib/seerrng"
          ln -s /usr/lib/seerrng/start.sh "$src/usr/bin/seerrng"
          cp packaging/aur/seerrng.service "$src/lib/systemd/system/"
          cp packaging/aur/seerrng.env "$src/etc/seerrng/"
          cp packaging/aur/seerrng.sysusers "$src/usr/lib/sysusers.d/seerrng.conf"
          cp packaging/aur/seerrng.tmpfiles "$src/usr/lib/tmpfiles.d/seerrng.conf"
          cp -r packaging/debian "$src/debian"
          cat > "$src/debian/changelog" <<EOF
          seerrng (${version}) unstable; urgency=medium

            * Release ${{ steps.version.outputs.tag }}

           -- snapetech <seerrng@proton.me>  $(date -R)
          EOF
          (cd "$src" && dpkg-buildpackage -us -uc -b)
          if [[ ! -f "seerrng_${version}_amd64.deb" ]]; then
            mv seerrng_*_amd64.deb "seerrng_${version}_amd64.deb"
          fi
          sha256sum "seerrng_${version}_amd64.deb" > "seerrng_${version}_amd64.deb.sha256"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          files: |
            seerrng_${{ steps.version.outputs.version }}_amd64.deb
            seerrng_${{ steps.version.outputs.version }}_amd64.deb.sha256

  rpm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9][0-9A-Za-z._+-]{0,127}$ ]] || { echo "Invalid release tag: $tag" >&2; exit 2; }
          [[ "$tag" != *-* ]] || { echo "Stable package channels reject pre-release tag: $tag" >&2; exit 2; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Install git for tag verification
        run: dnf install -y git
      - name: Initialize repository metadata for tag verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
            "refs/heads/main:refs/remotes/origin/main"
      - name: Verify release tag is on main
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: bash scripts/ensure-release-tag-on-main.sh "$TAG"
      - name: Install packaging tools
        run: dnf install -y gh rpm-build rpmdevtools systemd-rpm-macros
      - name: Download Linux asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in {1..80}; do
            if gh release download "${{ steps.version.outputs.tag }}" -R "$GITHUB_REPOSITORY" --pattern "seerrng-${{ steps.version.outputs.tag }}-linux-x64.tar.gz" --clobber; then
              exit 0
            fi
            sleep 30
          done
          exit 1
      - name: Build rpm
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          rpmdev-setuptree
          cp "seerrng-v${version}-linux-x64.tar.gz" ~/rpmbuild/SOURCES/
          cp packaging/aur/seerrng.{service,env,sysusers,tmpfiles} ~/rpmbuild/SOURCES/
          cp packaging/rpm/seerrng.spec ~/rpmbuild/SPECS/
          sed -i "s/^Version:.*/Version:        ${version}/" ~/rpmbuild/SPECS/seerrng.spec
          rpmbuild -bb ~/rpmbuild/SPECS/seerrng.spec
          find ~/rpmbuild/RPMS -name '*.rpm' -exec cp {} . \;
          for package in ./*.rpm; do
            sha256sum "${package#./}" > "${package#./}.sha256"
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          files: |
            *.rpm
            *.rpm.sha256

  appimage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9][0-9A-Za-z._+-]{0,127}$ ]] || { echo "Invalid release tag: $tag" >&2; exit 2; }
          [[ "$tag" != *-* ]] || { echo "Stable package channels reject pre-release tag: $tag" >&2; exit 2; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Verify release tag is on main
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: bash scripts/ensure-release-tag-on-main.sh "$TAG"
      - name: Checkout AppImage launcher files from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: appimage-packaging
          sparse-checkout: |
            packaging/appimage
            public
          persist-credentials: false
      - name: Download Linux asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in {1..80}; do
            if gh release download "${{ steps.version.outputs.tag }}" -R "$GITHUB_REPOSITORY" --pattern "seerrng-${{ steps.version.outputs.tag }}-linux-x64.tar.gz" --clobber; then
              exit 0
            fi
            sleep 30
          done
          exit 1
      - name: Build AppImage
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfuse2 curl
          appimagetool_url='https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage'
          curl -fsSL --retry 5 "$appimagetool_url" -o appimagetool
          echo 'a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  appimagetool' | sha256sum -c -
          node_version='22.22.2'
          node_archive="node-v${node_version}-linux-x64.tar.xz"
          node_base_url="https://nodejs.org/dist/v${node_version}"
          curl -fsSL --retry 5 "${node_base_url}/${node_archive}" -o "$node_archive"
          curl -fsSL --retry 5 "${node_base_url}/SHASUMS256.txt" \
            | awk -v archive="$node_archive" '$2 == archive { print; found = 1 } END { if (!found) exit 1 }' \
            > node.sha256
          sha256sum --check node.sha256
          mkdir -p node-runtime
          tar -xJf "$node_archive" -C node-runtime --strip-components=1 \
            "node-v${node_version}-linux-x64/bin/node" \
            "node-v${node_version}-linux-x64/LICENSE"
          chmod +x appimagetool appimage-packaging/packaging/appimage/AppRun
          mkdir -p SeerrNG.AppDir/usr/bin SeerrNG.AppDir/usr/lib/seerrng SeerrNG.AppDir/usr/share/applications SeerrNG.AppDir/usr/share/icons/hicolor/256x256/apps SeerrNG.AppDir/usr/share/licenses/nodejs
          tar -xzf "seerrng-${{ steps.version.outputs.tag }}-linux-x64.tar.gz" --strip-components=1 -C SeerrNG.AppDir/usr/lib/seerrng
          cp node-runtime/bin/node SeerrNG.AppDir/usr/bin/node
          cp node-runtime/LICENSE SeerrNG.AppDir/usr/share/licenses/nodejs/LICENSE
          cp appimage-packaging/packaging/appimage/AppRun SeerrNG.AppDir/
          cp appimage-packaging/packaging/appimage/seerrng.desktop SeerrNG.AppDir/
          cp appimage-packaging/packaging/appimage/seerrng.desktop SeerrNG.AppDir/usr/share/applications/
          cp appimage-packaging/public/android-chrome-512x512.png SeerrNG.AppDir/seerrng.png
          cp appimage-packaging/public/android-chrome-512x512.png SeerrNG.AppDir/usr/share/icons/hicolor/256x256/apps/seerrng.png
          app_dir='SeerrNG.AppDir/usr/lib/seerrng'
          find "$app_dir/node_modules/.pnpm" \
            -path '*/node_modules/@next/swc-linux-x64-gnu/*.node' \
            -type f -delete
          if find "$app_dir/node_modules/.pnpm" \
              -path '*/node_modules/@next/swc-linux-x64-gnu/*.node' \
              -type f -print -quit | grep -q .; then
            echo 'The AppImage still contains the build-only GNU SWC binary.' >&2
            exit 1
          fi
          while IFS= read -r -d '' binary; do
            if ! readelf -h "$binary" >/dev/null 2>&1; then
              continue
            fi
            required_glibc="$(readelf --version-info "$binary" \
              | grep -Eo 'GLIBC_[0-9]+(\.[0-9]+)+' \
              | sort -V | tail -n 1 || true)"
            if [ -n "$required_glibc" ] && \
                dpkg --compare-versions "${required_glibc#GLIBC_}" gt 2.29; then
              echo "AppImage binary requires ${required_glibc}: ${binary}" >&2
              exit 1
            fi
          done < <(find SeerrNG.AppDir -type f \
            \( -perm /111 -o -name '*.node' -o -name '*.so' -o -name '*.so.*' \) \
            -print0)
          ARCH=x86_64 ./appimagetool SeerrNG.AppDir "SeerrNG-${{ steps.version.outputs.version }}-x86_64.AppImage"
          sha256sum "SeerrNG-${{ steps.version.outputs.version }}-x86_64.AppImage" > "SeerrNG-${{ steps.version.outputs.version }}-x86_64.AppImage.sha256"
      - name: Smoke-test AppImage
        shell: bash
        run: |
          set -euo pipefail
          config_directory="${RUNNER_TEMP}/seerrng-appimage-config"
          mkdir -p "$config_directory"
          appimage_path="$PWD/SeerrNG-${{ steps.version.outputs.version }}-x86_64.AppImage"
          CONFIG_DIRECTORY="$config_directory" PORT=55155 \
            "$appimage_path" --appimage-extract-and-run > "$RUNNER_TEMP/appimage.log" 2>&1 &
          appimage_pid=$!
          cleanup() {
            kill "$appimage_pid" 2>/dev/null || true
            wait "$appimage_pid" 2>/dev/null || true
          }
          trap cleanup EXIT HUP INT TERM
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:55155/api/v1/settings/public >/dev/null; then
              curl --fail --silent --show-error --location http://127.0.0.1:55155/ > "$RUNNER_TEMP/appimage-home.html"
              grep -qi '<html' "$RUNNER_TEMP/appimage-home.html"
              echo 'AppImage served its first-run web interface successfully.'
              exit 0
            fi
            if ! kill -0 "$appimage_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/appimage.log" >&2
              exit 1
            fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/appimage.log" >&2
          echo 'AppImage did not serve its web interface within 30 seconds.' >&2
          exit 1
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          draft: true
          files: |
            SeerrNG-*.AppImage
            SeerrNG-*.AppImage.sha256
