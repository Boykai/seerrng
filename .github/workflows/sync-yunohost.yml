# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Sync YunoHost package

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release to copy into the YunoHost manifest
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Published stable release to copy into the YunoHost manifest
        required: false
        type: string
    secrets:
      YUNOHOST_PACKAGE_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: seerrng-yunohost-package-testing
  cancel-in-progress: false

jobs:
  sync:
    name: Sync package and release version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout SeerrNG main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Configure git identity
        env:
          GIT_ACTOR: ${{ github.actor }}
        run: |
          git config user.name "$GIT_ACTOR"
          git config user.email "$GIT_ACTOR@users.noreply.github.com"

      - name: Update manifest from published release assets
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Skipping YunoHost version update for non-stable tag $RELEASE_TAG."
            exit 0
          fi

          assets_dir="$RUNNER_TEMP/seerrng-yunohost-release-assets"
          mkdir -p "$assets_dir"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            gh release download "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --clobber \
              --pattern "seerrng-${RELEASE_TAG}-linux-x64.tar.gz" \
              --pattern "seerrng-${RELEASE_TAG}-linux-x64.sha256" \
              --pattern "seerrng-${RELEASE_TAG}-linux-arm64.tar.gz" \
              --pattern "seerrng-${RELEASE_TAG}-linux-arm64.sha256" \
              --dir "$assets_dir"
            node scripts/update-yunohost-release.mjs \
              --tag "$RELEASE_TAG" \
              --assets-dir "$assets_dir"

            if git diff --quiet -- packaging/yunohost/manifest.toml; then
              echo 'The YunoHost manifest already matches this release or a newer one.'
              break
            fi

            git add packaging/yunohost/manifest.toml
            git commit \
              -m "chore(yunohost): align package with ${RELEASE_TAG}" \
              -m "release-note: none"
            if git push origin HEAD:refs/heads/main; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo 'Could not push the YunoHost manifest update after three attempts.' >&2
              exit 1
            fi
            git reset --hard origin/main
          done

      - name: Checkout YunoHost-Apps package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: YunoHost-Apps/seerrng_ynh
          ref: testing
          token: ${{ secrets.YUNOHOST_PACKAGE_TOKEN }}
          path: .yunohost
          fetch-depth: 0

      - name: Configure package commit identity
        run: |
          git -C .yunohost config user.name 'github-actions[bot]'
          git -C .yunohost config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Mirror SeerrNG package files to YunoHost-Apps
        env:
          SEERRNG_SYNC_ALL: 'true'
          SEERRNG_YNH_REPO: ${{ github.workspace }}/.yunohost
        run: node scripts/sync-yunohost-package.mjs
