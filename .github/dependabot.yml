version: 2
# Dependency-only bot PRs carry the internal-only marker into their merge
# commit so push validation can enforce the release-note contract.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "release-note: none"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "release-note: none"
    groups:
      release-note-none-codeql-action:
        patterns:
          - "github/codeql-action/*"
