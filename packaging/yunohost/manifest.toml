#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "seerrng"
name = "SeerrNG"
description.en = "Media request management for movies, television, music, comics, and books"
version = "3.48.2~ynh1"
maintainers = ["snapetech"]

[upstream]
license = "MIT"
website = "https://github.com/snapetech/seerrng"
userdoc = "https://github.com/snapetech/seerrng/blob/main/docs/getting-started/third-parties/yunohost.mdx"
admindoc = "https://github.com/snapetech/seerrng/blob/main/docs/README.md"
code = "https://github.com/snapetech/seerrng"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = false
sso = false
disk = "1G"
ram.build = "50M"
ram.runtime = "512M"

[install]
  [install.domain]
  type = "domain"

  [install.path]
  type = "path"
  default = "/"
  pattern = { regexp = "^/$", error = "SeerrNG must be installed at the root of a dedicated domain; URL subpaths are not supported." }

  [install.init_main_permission]
  type = "group"
  default = "visitors"

[resources]
  [resources.sources]
    [resources.sources.main]
    in_subdir = true
    format = "tar.gz"
    amd64.url = "https://github.com/snapetech/seerrng/releases/download/v3.48.2/seerrng-v3.48.2-linux-x64.tar.gz"
    amd64.sha256 = "251380ba10302d3a32d1bc5e772124e80e1c30c4ec76087eaf388049dfc6279d"
    arm64.url = "https://github.com/snapetech/seerrng/releases/download/v3.48.2/seerrng-v3.48.2-linux-arm64.tar.gz"
    arm64.sha256 = "9cd890e5ff3bc438617a818c7566d6b1aaee0d08e0f9efbb058a94d6b4675881"
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^seerrng-v.*-linux-x64\\.tar\\.gz$"
    autoupdate.asset.arm64 = "^seerrng-v.*-linux-arm64\\.tar\\.gz$"

  [resources.system_user]

  [resources.install_dir]

  [resources.data_dir]

  [resources.permissions]
  main.url = "/"
  main.auth_header = false

  [resources.ports]
  main.default = 5055

  [resources.nodejs]
  version = "24"

  [resources.apt]
    packages = "rsync"
