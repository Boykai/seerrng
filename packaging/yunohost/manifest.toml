#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "seerrng"
name = "SeerrNG"
description.en = "Media request management for movies, television, music, comics, and books"
version = "3.39.3~ynh1"
maintainers = ["snapetech"]

[upstream]
license = "MIT"
website = "https://github.com/snapetech/seerrng"
userdoc = "https://snapetech.github.io/seerrng/"
admindoc = "https://snapetech.github.io/seerrng/"
code = "https://github.com/snapetech/seerrng"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = false
sso = false
disk = "1G"
ram.build = "50M"
ram.runtime = "512M"

[install]
  [install.domain]
  type = "domain"

  [install.path]
  type = "path"
  default = "/"
  pattern = { regexp = "^/$", error = "SeerrNG must be installed at the root of a dedicated domain; URL subpaths are not supported." }

  [install.init_main_permission]
  type = "group"
  default = "visitors"

[resources]
  [resources.sources]
    [resources.sources.main]
    in_subdir = true
    format = "tar.gz"
    amd64.url = "https://github.com/snapetech/seerrng/releases/download/v3.39.3/seerrng-v3.39.3-linux-x64.tar.gz"
    amd64.sha256 = "d984e06d4390f0858cca1b03bd90b407bd7c6fb9f411a0ed56e797c547b13f24"
    arm64.url = "https://github.com/snapetech/seerrng/releases/download/v3.39.3/seerrng-v3.39.3-linux-arm64.tar.gz"
    arm64.sha256 = "66b4b85bc87aa0235e1cb4436cdc9b4b86e90e8666cf579fcdfb3f4fea72ad9c"
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^seerrng-v.*-linux-x64\\.tar\\.gz$"
    autoupdate.asset.arm64 = "^seerrng-v.*-linux-arm64\\.tar\\.gz$"

  [resources.system_user]

  [resources.install_dir]

  [resources.data_dir]

  [resources.permissions]
  main.url = "/"
  main.auth_header = false

  [resources.ports]
  main.default = 5055

  [resources.nodejs]
  version = "22"

  [resources.apt]
  packages = "rsync"
